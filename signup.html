<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenes Café - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Scenes Café</h1>

    <h2>Sign up</h2>

    <form>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your name" required>
        <br><br>

        <label for="surname">Surname:</label>
        <input type="text" id="surname" name="surname"
               placeholder="Enter your surname" required>
        <br><br>

        <label for="contact">Contact Details:</label>
        <input type="tel" id="contact" name="contact" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age"
               min="18" max="25" required>
        <br><br>

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="M" required>
        <label for="male">M</label>

        <input type="radio" id="female" name="gender" value="F">
        <label for="female">F</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <br><br>

        <label for="town">Town of Birth:</label>

        <select id="town" name="town" required>
            <option value="">Select Town</option>
            <option value="Pretoria">Pretoria</option>
            <option value="Johannesburg">Johannesburg</option>
            <option value="Durban">Durban</option>
            <option value="Cape Town">Cape Town</option>
            <option value="Bloemfontein">Bloemfontein</option>
        </select>

        <br><br>

        <input type="checkbox" id="member" name="member">
        <label for="member">I am already a member</label>

        <br><br>

        <input type="reset" value="Reset">
        <input type="submit" value="Submit">

    </form>

    <br>

    <a href="index.html">Back to Home</a>

</body>
</html>
